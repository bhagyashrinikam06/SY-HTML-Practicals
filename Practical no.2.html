<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<style>
    form, table{
           border:6px solid red;
           background:yellow;
}
</style>
<body>

<h2>Student Registration Form</h2>

<form>

    <label>Full Name:</label><br>
    <input type="text" placeholder="Enter your full name" required><br><br>

    <label>Email:</label><br>
    <input type="email" placeholder="Enter your email" required><br><br>

    <label>Password:</label><br>
    <input type="password" placeholder="Enter password" required><br><br>

    <label>Mobile Number:</label><br>
    <input type="tel" placeholder="Enter mobile number" required><br><br>

    <label>Date of Birth:</label><br>
    <input type="date"><br><br>

    <label>Gender:</label><br>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <input type="radio" name="gender"> Other

    <br><br>

    <label>Course:</label><br>
    <select>
        <option>Select Course</option> 
        <option>Aiml Engineering</option>
        <option>Computer Engineering</option>
        <option>Information Technology</option>
        <option>Mechanical Engineering</option>
        <option>Electronics Engineering</option>
    </select>

    <br><br>

    <label>Skills:</label><br>
    <input type="checkbox"> HTML
    <input type="checkbox"> CSS
    <input type="checkbox"> JavaScript
    <input type="checkbox"> React

    <br><br>

    <label>Address:</label><br>
    <textarea rows="4" cols="40" placeholder="Enter your address"></textarea>

    <br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Clear">

</form>

</body>
</html>
